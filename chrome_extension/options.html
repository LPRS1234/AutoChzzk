<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoChzzk 연결</title>
</head>
<body>
  <main>
    <h1>AutoChzzk 연결</h1>
    <p>AutoChzzk 앱의 ‘확장 연결 코드’ 버튼에서 코드를 복사해 붙여 넣으세요. 사용하는 Chrome 프로필마다 한 번씩 연결해야 합니다.</p>
    <p>기존 확장 프로그램에서 업데이트한 경우에도 연결 코드를 등록해야 자동 탭 제어가 시작됩니다.</p>
    <form id="pairing-form">
      <label for="pairing-code">연결 코드</label>
      <input id="pairing-code" type="password" autocomplete="off" spellcheck="false" minlength="64" maxlength="64" required>
      <button type="submit">연결 코드 저장</button>
    </form>
    <p id="status" role="status"></p>
    <p>연결 코드는 다른 사람에게 공유하지 마세요. 이 확장 프로그램의 설정 화면에만 입력하세요.</p>
  </main>
  <script src="options.js"></script>
</body>
</html>
